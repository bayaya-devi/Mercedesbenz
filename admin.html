<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administration — Étoile & Moteur</title><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="news.css"></head><body class="admin-page"><header><a class="brand" href="index.html"><b>✦</b> ÉTOILE <i>&</i> MOTEUR</a><nav><a href="index.html" data-i18n="home">Accueil</a><a href="actualites.html" data-i18n="news">Actualités</a></nav><div class="language-switcher"><button data-lang="fr">FR</button><span>/</span><button data-lang="ar">العربية</button></div></header><main class="admin-main"><section id="login-panel" class="panel"><p class="kicker" data-i18n="private">Espace privé</p><h1 data-i18n="signIn">Connexion</h1><p data-i18n="signInText">Accédez à l'éditeur du journal.</p><form id="login-form"><label><span data-i18n="username">Identifiant</span><input id="username" autocomplete="username" required></label><label><span data-i18n="password">Mot de passe</span><input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit" data-i18n="connect">Se connecter</button><p id="login-message" class="message"></p></form></section><section id="dashboard" class="dashboard" hidden><div class="dashboard-head"><div><p class="kicker" data-i18n="editorial">Espace éditorial</p><h1 data-i18n="createArticle">Créer un article</h1></div><button id="logout" class="secondary" data-i18n="logout">Déconnexion</button></div><form id="article-form"><div class="form-grid"><label class="wide"><span data-i18n="title">Titre *</span><input id="title" maxlength="140" required></label><label class="wide"><span data-i18n="subtitle">Sous-titre — facultatif</span><input id="subtitle" maxlength="240"></label><label><span data-i18n="language">Langue de l'article</span><select id="language"><option value="fr">Français</option><option value="ar">العربية</option></select></label><label><span data-i18n="image">Image — facultative</span><input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide"><span data-i18n="content">Contenu *</span><textarea id="content" rows="12" required></textarea></label></div><div class="actions"><button type="button" id="save-draft" class="secondary" data-i18n="draft">Enregistrer le brouillon</button><button type="submit" class="primary" data-i18n="publish">Publier l'article</button></div><p id="article-message" class="message"></p></form><div class="managed"><h2 data-i18n="yourArticles">Vos articles</h2><div id="managed-articles"></div></div></section><section id="config-panel" class="panel" hidden><p class="kicker">Supabase</p><h1 data-i18n="setup">Configuration requise</h1><p data-i18n="setupText">Ajoutez l'URL et la clé publique Supabase pour activer l'administration.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js?v=20260913-locale-v1"></script></body></html>
